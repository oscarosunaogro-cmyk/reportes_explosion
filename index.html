/* ============ ESTADO ============ */
let reports = [];            // [{id, idTienda, piezas, lote, caducidad, reportadoPor, notas, hasPhoto, createdAt}]
let collapsedRegions = new Set();
let currentStore = null;
let pendingPhoto = null;

let firebaseReady = false, db = null, reportsCol = null, photosCol = null;
try{
  if(typeof firebase === 'undefined') throw new Error('SDK de Firebase no disponible');
  if(firebaseConfig.apiKey === 'PEGA_AQUI') throw new Error('Falta pegar el firebaseConfig');
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  reportsCol = db.collection('reportes_explosion');
  photosCol = db.collection('fotos_explosion');
  firebaseReady = true;
}catch(e){ console.warn('Firebase no inicializado:', e.message); }

const el = id => document.getElementById(id);
const titleCase = s => String(s||'').toLowerCase().replace(/\b\w/g, c => c.toUpperCase());
const escHtml = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* ============ INIT ============ */
function init(){
  bindControls();
  if(!firebaseReady){
    el('sharedNote').classList.add('warn');
    el('sharedNote').textContent = '⚠ Firebase no está configurado: los reportes NO se guardan en la nube (solo en esta sesión). Pega tu firebaseConfig.';
  }else{
    el('sharedNote').textContent = '● Los reportes se sincronizan en vivo para todos los que abran este enlace.';
  }
  populateRegionFilter();
  render();
  if(firebaseReady){
    reportsCol.orderBy('createdAt','desc').onSnapshot(snap=>{
      reports = snap.docs.map(d => ({id:d.id, ...d.data()}));
      render();
      if(currentStore) renderReportList();
    }, err => { console.error(err); showToast('Error de sincronización con Firebase'); });
  }
}

function populateRegionFilter(){
  const regions = [...new Set(STORES.map(s=>s.region))].sort();
  const sel = el('regionFilter');
  regions.forEach(r=>{ const o = document.createElement('option'); o.value = r; o.textContent = titleCase(r); sel.appendChild(o); });
}

/* ============ DATOS DERIVADOS ============ */
const reportsOf = id => reports.filter(r => String(r.idTienda) === String(id));
const piezasOf = id => reportsOf(id).reduce((s,r)=> s + (r.piezas||0), 0);

function updateStats(){
  const storesWith = new Set(reports.map(r => String(r.idTienda)));
  el('statPiezas').textContent = reports.reduce((s,r)=> s + (r.piezas||0), 0);
  el('statTiendas').textContent = storesWith.size;
  el('statReportes').textContent = reports.length;
}

/* ============ RENDER ============ */
function getFiltered(){
  const q = el('searchInput').value.trim().toLowerCase();
  const region = el('regionFilter').value;
  const status = el('statusFilter').value;
  return STORES.filter(s=>{
    if(region && s.region !== region) return false;
    const has = reportsOf(s.idTienda).length > 0;
    if(status === 'reported' && !has) return false;
    if(status === 'none' && has) return false;
    if(q && !(s.tienda + ' ' + s.zona).toLowerCase().includes(q)) return false;
    return true;
  });
}

function render(){
  updateStats();
  const filtered = getFiltered();
  const main = el('mainContent');
  if(!filtered.length){
    main.innerHTML = `<div class="empty-state"><div class="big">Sin resultados</div>Ajusta la búsqueda o los filtros.</div>`;
    return;
  }
  const byRegion = {};
  filtered.forEach(s => (byRegion[s.region] = byRegion[s.region] || []).push(s));
  main.innerHTML = Object.keys(byRegion).sort().map(region=>{
    const stores = byRegion[region].sort((a,b)=> a.tienda.localeCompare(b.tienda));
    const withReport = stores.filter(s => reportsOf(s.idTienda).length).length;
    return `
    <div class="region-group ${collapsedRegions.has(region)?'collapsed':''}">
      <div class="region-head" data-toggle-region="${escHtml(region)}">
        <div class="region-title"><span class="caret">▾</span>${escHtml(titleCase(region))}</div>
        <div class="region-count"><b>${withReport}</b>/${stores.length} con reporte</div>
      </div>
      <div class="region-list">${stores.map(storeCardHtml).join('')}</div>
    </div>`;
  }).join('');

  main.querySelectorAll('[data-toggle-region]').forEach(n=> n.addEventListener('click', ()=>{
    const r = n.getAttribute('data-toggle-region');
    collapsedRegions.has(r) ? collapsedRegions.delete(r) : collapsedRegions.add(r);
    render();
  }));
  main.querySelectorAll('[data-open-id]').forEach(n=> n.addEventListener('click', e=>{
    e.stopPropagation(); openModal(n.getAttribute('data-open-id'));
  }));
}

function storeCardHtml(s){
  const n = reportsOf(s.idTienda).length;
  const pz = piezasOf(s.idTienda);
  return `
  <div class="store-card ${n?'reported':''}">
    <div class="status-dot"></div>
    <div class="store-info">
      <div class="store-name">${escHtml(titleCase(s.tienda))}</div>
      <div class="store-meta">
        ${s.zona ? `<span class="zona-tag">${escHtml(titleCase(s.zona))}</span>` : ''}
      </div>
    </div>
    <div class="exist-badge ${n?'affected':''}">
      ${n ? `<b>${pz}</b>pz afectadas` : `<b>${s.existPiezas}</b>pz · ${s.existCajas}cj`}
    </div>
    <button class="btn ${n?'btn-view':'btn-report'}" data-open-id="${escHtml(s.idTienda)}">${n ? 'Ver / Agregar' : 'Reportar'}</button>
  </div>`;
}

/* ============ MODAL ============ */
function openModal(idTienda){
  const store = STORES.find(s => String(s.idTienda) === String(idTienda));
  if(!store) return;
  currentStore = store;
  pendingPhoto = null;
  el('modalRegion').textContent = titleCase(store.region) + (store.zona ? ' · ' + titleCase(store.zona) : '');
  el('modalTitle').textContent = titleCase(store.tienda);
  el('modalSub').textContent = `Existencia: ${store.existPiezas} pz / ${store.existCajas} cj`;

  el('modalBody').innerHTML = `
    <div id="reportList"></div>
    <div class="section-title">Nuevo reporte</div>

    <div class="row2">
      <div>
        <div class="field-label" style="margin-top:0">Piezas afectadas</div>
        <input class="text-input qty-input" type="number" min="1" step="1" id="piezas" placeholder="0">
      </div>
      <div>
        <div class="field-label" style="margin-top:0">Fecha de caducidad</div>
        <input class="text-input" type="date" id="caducidad">
      </div>
    </div>

    <div class="field-label">Lote</div>
    <input class="text-input qty-input" id="lote" placeholder="Ej. L12345" autocapitalize="characters">

    <div class="field-label">Fotografía de soporte</div>
    <div class="photo-drop" id="photoDrop">
      <span class="icon">📷</span>
      <div class="hint"><b>Toca para tomar o subir</b> una foto del producto con explosión</div>
    </div>
    <input type="file" accept="image/*" capture="environment" id="photoInput" style="display:none">

    <div class="field-label">Reportado por</div>
    <input class="text-input" id="reportadoPor" placeholder="Nombre de quien reporta el accidente">

    <div class="field-label">Notas <span class="opt">(opcional)</span></div>
    <textarea id="notas" placeholder="Cómo ocurrió, ubicación en piso/almacén, etc."></textarea>

    <button class="btn-big" id="saveBtn">Guardar reporte</button>
  `;
  el('photoDrop').addEventListener('click', ()=> el('photoInput').click());
  el('photoInput').addEventListener('change', handlePhotoSelect);
  el('saveBtn').addEventListener('click', submitReport);
  renderReportList();
  el('overlay').classList.add('open');
}

function renderReportList(){
  const box = el('reportList');
  if(!box || !currentStore) return;
  const list = reportsOf(currentStore.idTienda);
  if(!list.length){ box.innerHTML = ''; return; }
  const total = list.reduce((s,r)=> s + (r.piezas||0), 0);
  box.innerHTML = `
    <div class="section-title">Reportes de esta tienda · ${total} pz afectadas</div>
    ${list.map(r=>`
      <div class="report-item" data-rid="${escHtml(r.id)}">
        <div class="report-top">
          <span class="report-qty">${r.piezas} pz</span>
          <span class="report-date">${r.createdAt ? new Date(r.createdAt).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}) : ''}</span>
        </div>
        <div class="report-meta">
          <span class="k">Lote:</span> ${escHtml(r.lote)} · <span class="k">Caduca:</span> ${escHtml(fmtDate(r.caducidad))}<br>
          <span class="k">Reportó:</span> ${escHtml(r.reportadoPor)}
          ${r.notas ? `<br><span class="k">Notas:</span> ${escHtml(r.notas)}` : ''}
        </div>
        <div class="report-actions">
          ${r.hasPhoto ? `<button class="link-btn" data-photo="${escHtml(r.id)}">Ver foto</button>` : '<span class="report-date">Sin foto</span>'}
          <button class="link-btn danger" data-del="${escHtml(r.id)}">Eliminar</button>
        </div>
        <div class="report-photo" id="photo-${escHtml(r.id)}"></div>
      </div>`).join('')}
    <div class="divider"></div>`;
  box.querySelectorAll('[data-photo]').forEach(b => b.addEventListener('click', ()=> showPhoto(b.getAttribute('data-photo'))));
  box.querySelectorAll('[data-del]').forEach(b => b.addEventListener('click', ()=> deleteReport(b.getAttribute('data-del'))));
}

function fmtDate(iso){
  if(!iso) return '—';
  const [y,m,d] = iso.split('-');
  return (y && m && d) ? `${d}/${m}/${y}` : iso;
}

async function showPhoto(id){
  const box = document.getElementById('photo-' + id);
  if(!box) return;
  if(box.innerHTML){ box.innerHTML = ''; return; }
  if(!firebaseReady){ box.innerHTML = '<div class="report-date">Sin conexión a la nube.</div>'; return; }
  box.innerHTML = '<div class="report-date">Cargando foto…</div>';
  try{
    const doc = await photosCol.doc(id).get();
    box.innerHTML = (doc.exists && doc.data().photo) ? `<img src="${doc.data().photo}" alt="Foto de soporte">` : '<div class="report-date">No se encontró la foto.</div>';
  }catch(e){ box.innerHTML = '<div class="report-date">No se pudo cargar la foto.</div>'; }
}

function handlePhotoSelect(e){
  const file = e.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = ev=>{
    const img = new Image();
    img.onload = ()=>{
      const scale = Math.min(1, 900 / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width * scale; canvas.height = img.height * scale;
      canvas.getContext('2d').drawImage(img, 0, 0, canvas.width, canvas.height);
      pendingPhoto = canvas.toDataURL('image/jpeg', 0.62);
      const drop = el('photoDrop');
      drop.classList.remove('err');
      drop.classList.add('has-photo');
      drop.innerHTML = `<img src="${pendingPhoto}" alt="Vista previa"><div class="photo-actions"><button type="button" id="retakeBtn">Cambiar foto</button></div>`;
      el('retakeBtn').addEventListener('click', ev2 => { ev2.stopPropagation(); el('photoInput').click(); });
    };
    img.src = ev.target.result;
  };
  reader.readAsDataURL(file);
}

async function submitReport(){
  const piezas = parseInt(el('piezas').value, 10);
  const caducidad = el('caducidad').value;
  const lote = el('lote').value.trim().toUpperCase();
  const reportadoPor = el('reportadoPor').value.trim();
  const notas = el('notas').value.trim();

  // validación
  let ok = true;
  const mark = (id, bad) => { el(id).classList.toggle('err', bad); if(bad) ok = false; };
  mark('piezas', !(piezas > 0));
  mark('caducidad', !caducidad);
  mark('lote', !lote);
  mark('reportadoPor', !reportadoPor);
  el('photoDrop').classList.toggle('err', !pendingPhoto);
  if(!pendingPhoto) ok = false;
  if(!ok){ showToast('Completa los campos marcados en rojo'); return; }

  const btn = el('saveBtn');
  btn.disabled = true; btn.textContent = 'Guardando…';

  const report = {
    idTienda: String(currentStore.idTienda),
    tienda: currentStore.tienda,
    region: currentStore.region,
    zona: currentStore.zona,
    articulo: ARTICULO,
    piezas, caducidad, lote, reportadoPor,
    notas: notas || null,
    hasPhoto: !!pendingPhoto,
    createdAt: new Date().toISOString()
  };

  try{
    if(firebaseReady){
      const ref = reportsCol.doc();
      await photosCol.doc(ref.id).set({ photo: pendingPhoto });
      await ref.set(report);   // onSnapshot actualiza la lista
    }else{
      reports.unshift({ id: 'local-' + Date.now(), ...report });
      showToast('Guardado solo en esta sesión (sin Firebase).');
    }
    closeModal();
    render();
    showToast('Reporte guardado');
  }catch(e){
    console.error(e);
    btn.disabled = false; btn.textContent = 'Guardar reporte';
    showToast('No se pudo guardar. Intenta de nuevo.');
  }
}

async function deleteReport(id){
  if(!confirm('¿Eliminar este reporte?')) return;
  try{
    if(firebaseReady){
      await reportsCol.doc(id).delete();
      try{ await photosCol.doc(id).delete(); }catch(e){}
    }else{
      reports = reports.filter(r => r.id !== id);
      render(); renderReportList();
    }
    showToast('Reporte eliminado');
  }catch(e){ showToast('No se pudo eliminar'); }
}

function closeModal(){
  el('overlay').classList.remove('open');
  currentStore = null;
}

let toastTimer;
function showToast(msg){
  const t = el('toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(()=> t.classList.remove('show'), 2600);
}

function bindControls(){
  el('searchInput').addEventListener('input', render);
  el('regionFilter').addEventListener('change', render);
  el('statusFilter').addEventListener('change', render);
  el('modalClose').addEventListener('click', closeModal);
  el('overlay').addEventListener('click', e => { if(e.target.id === 'overlay') closeModal(); });
  el('exportBtn').addEventListener('click', exportToExcel);
}

/* ============ EXPORTAR A EXCEL ============ */
function exportToExcel(){
  try{
    const sorted = [...reports].sort((a,b)=> String(a.createdAt).localeCompare(String(b.createdAt)));
    const detalle = sorted.map(r => ({
      'Región': titleCase(r.region),
      'Zona': titleCase(r.zona),
      'Tienda': titleCase(r.tienda),
      'Artículo': r.articulo || ARTICULO,
      'Piezas afectadas': r.piezas,
      'Lote': r.lote,
      'Fecha de caducidad': fmtDate(r.caducidad),
      'Reportado por': r.reportadoPor,
      'Fecha y hora del reporte': r.createdAt ? new Date(r.createdAt).toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'}) : '',
      'Foto adjunta': r.hasPhoto ? 'Sí' : 'No',
      'Notas': r.notas || ''
    }));

    const porTienda = STORES.map(s => ({
      'Región': titleCase(s.region),
      'Zona': titleCase(s.zona),
      'ID Artículo': s.idArticulo,
      'Tienda': titleCase(s.tienda),
      'Existencia Piezas': s.existPiezas,
      'Existencia Cajas': s.existCajas,
      'Reportes': reportsOf(s.idTienda).length,
      'Piezas afectadas': piezasOf(s.idTienda)
    }));

    const wb = XLSX.utils.book_new();
    const ws1 = XLSX.utils.json_to_sheet(detalle.length ? detalle : [{'Sin reportes':''}]);
    ws1['!cols'] = [{wch:16},{wch:20},{wch:28},{wch:30},{wch:10},{wch:14},{wch:14},{wch:26},{wch:20},{wch:10},{wch:40}];
    XLSX.utils.book_append_sheet(wb, ws1, 'Reportes');

    const ws2 = XLSX.utils.json_to_sheet(porTienda);
    ws2['!cols'] = [{wch:16},{wch:20},{wch:10},{wch:28},{wch:10},{wch:10},{wch:10},{wch:12}];
    XLSX.utils.book_append_sheet(wb, ws2, 'Por tienda');

    const total = reports.reduce((s,r)=> s + (r.piezas||0), 0);
    const ws3 = XLSX.utils.json_to_sheet([
      {Concepto:'Artículo', Valor: ARTICULO},
      {Concepto:'Total de tiendas', Valor: STORES.length},
      {Concepto:'Tiendas con reporte', Valor: new Set(reports.map(r=>String(r.idTienda))).size},
      {Concepto:'Total de reportes', Valor: reports.length},
      {Concepto:'Total piezas afectadas', Valor: total},
      {Concepto:'Generado', Valor: new Date().toLocaleString('es-MX',{dateStyle:'medium',timeStyle:'short'})}
    ]);
    ws3['!cols'] = [{wch:24},{wch:34}];
    XLSX.utils.book_append_sheet(wb, ws3, 'Resumen');

    XLSX.writeFile(wb, `explosiones-agua-mineral-${new Date().toISOString().slice(0,10)}.xlsx`);
    showToast('Excel generado');
  }catch(e){ console.error(e); showToast('No se pudo generar el Excel'); }
}

init();
</script>
